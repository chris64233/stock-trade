spring:
  application:
    name: stock-trade
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:h2:mem:stock-trade;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
